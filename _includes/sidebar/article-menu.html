<style type="text/css" media="screen">
.post-menu ul {
  list-style: none;
  padding: 0;
  margin: 0;
}
</style>

<div class="post-menu">
  <div class="post-menu-title">TOC</div>
  <div class="post-menu-content"></div>
</div>

<script>
  function generateContent() {
    var menu = document.querySelector(".post-menu");
    var menuContent =  menu.querySelector(".post-menu-content");
    var headings = document.querySelector(".post-content").querySelectorAll("h1, h2, h3, h4, h5, h6");

    // Hide menu when no headings
    if (headings.length == 0) {
      return menu.style.display = "none";
    }

    // Generate nested post menu
    var menuHTML = '';
    var stack = [];
    var openUls = 0;
    for (var i = 0; i < headings.length; i++) {
      var h = headings[i];
      var level = parseInt(h.tagName.substring(1));

      if (stack.length > 0 && level > stack[stack.length - 1]) {
        // Deeper: open a nested list inside the previous item
        menuHTML += '<ul>';
        openUls += 1;
      } else if (stack.length > 0 && level < stack[stack.length - 1]) {
        // Shallower: close previous item and nested lists up to this level
        menuHTML += '</li>';
        while (stack.length > 1 && level < stack[stack.length - 1]) {
          menuHTML += '</ul></li>';
          stack.pop();
          openUls -= 1;
        }
      } else if (stack.length > 0) {
        // Same level: close previous item (sibling)
        menuHTML += '</li>';
      } else {
        // First item: open root list
        menuHTML += '<ul>';
        openUls += 1;
      }

      stack.push(level);
      menuHTML += (
        '<li class="h-h' + level + '">'
        + '<a href="#h-' + h.getAttribute('id') + '">' + h.textContent + '</a>');
    }

    // Close remaining open items and lists
    menuHTML += '</li>';
    for (var i = 1; i < openUls; i++) {
      menuHTML += '</ul></li>';
    }
    menuHTML += '</ul>';

    menuContent.innerHTML = menuHTML;

    // The header element
    var header = document.querySelector('header.site-header');

    function doMenuCollapse(activeItem) {
      var items = menuContent.querySelectorAll('li');

      if (items.length < 20) {
        return;
      }

      // Hide all nested lists
      var nested = menuContent.querySelectorAll('ul ul');
      for (var i = 0; i < nested.length; i++) {
        nested[i].style.display = 'none';
      }

      if (!activeItem) {
        return;
      }

      // Reveal the subtree of the top-level item containing the active item
      var root = menuContent.firstElementChild;
      var top = activeItem;
      while (top.parentElement !== root) {
        top = top.parentElement;
      }
      var show = top.querySelectorAll('ul');
      for (var i = 0; i < show.length; i++) {
        show[i].style.display = '';
      }
    }

    // Init menu collapsed
    doMenuCollapse(null);

    // Active the menu item
    window.addEventListener('scroll', function (event) {
      var lastActive = menuContent.querySelector('.active');
      var changed = true;
      var curActive = null;
      for (var i = headings.length - 1; i >= 0; i--) {
        var h = headings[i];
        var headingRect = h.getBoundingClientRect();
        var headerRect = header.getBoundingClientRect();
        var headerTop = Math.floor(headerRect.top);
        var headerHeight = Math.floor(headerRect.height);
        var headerHeight = headerTop + headerHeight + 20;
        if (headingRect.top <= headerHeight) {
          var id = 'h-' + h.getAttribute('id');
          var a = menuContent.querySelector('a[href="#' + id  + '"]');
          curActive = a ? a.parentNode : null;
          if (curActive) {
            curActive.classList.add('active');
          }
          if (lastActive == curActive) {
            changed = false;
          }
          break;
        }
      }
      if (changed) {
        if (lastActive && lastActive != curActive) {
          lastActive.classList.remove('active');
        }
        doMenuCollapse(curActive);
      }
      event.preventDefault();
    });
  }
  generateContent();
</script>
